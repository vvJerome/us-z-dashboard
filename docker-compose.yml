services:

  # ── Data layer ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: scraper
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scraper} -d scraper"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  # Test-only PostgreSQL — only starts when `--profile test` is passed.
  # Usage: docker compose --profile test up -d postgres-test
  postgres-test:
    profiles: [test]
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: scraper_test
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Application ─────────────────────────────────────────────────────────────

  backend:
    # Production: docker compose pull && docker compose up -d
    # Local dev:  docker compose up -d --build
    image: ghcr.io/${GITHUB_ORG:-local}/us-z-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - data_volume:/data
      - ${WORKER_SSH_KEY_PATH:-/root/.ssh/id_worker_v3}:/root/.ssh/id_worker_v3:ro
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
    deploy:
      resources:
        limits:
          memory: 256M

  dashboard:
    image: ghcr.io/${GITHUB_ORG:-local}/us-z-dashboard-app:${IMAGE_TAG:-latest}
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Reverse proxy ───────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
  data_volume:
