name: Test pipeline end-to-end

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kestra/flows/**"
      - ".github/workflows/test-pipeline.yml"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create test input file
        run: |
          mkdir -p data/inputs/ci-test-job/
          echo '{"unique_id":"ci-001","business_name":"Test Company","domain":"example.com","email":"contact@example.com"}' \
            > data/inputs/ci-test-job/input.jsonl

      - name: Run pipeline container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/data:/data" \
            -e JOB_ID=ci-test-job \
            -e INPUT_FILE_KEY=inputs/ci-test-job/input.jsonl \
            -e CONFIG='{"enable_proxy":false,"skip_duplicates":true}' \
            -e DATA_DIR=/data \
            -e SERPER_API_KEY=${{ secrets.SERPER_API_KEY }} \
            -e ZUHAL_API_KEY=${{ secrets.ZUHAL_API_KEY }} \
            -e BBOPS_BASE_URL=https://email-verifier.bbops.io \
            ghcr.io/${{ env.OWNER }}/us-z-3:latest
        timeout-minutes: 15

      - name: Verify output file exists and has content
        run: |
          echo "=== Output file ==="
          ls -lh data/outputs/ci-test-job/result.csv
          wc -l data/outputs/ci-test-job/result.csv
          echo "=== First 5 lines ==="
          head -5 data/outputs/ci-test-job/result.csv

      - name: Verify log file exists
        run: |
          ls -lh data/logs/ci-test-job/run.log
          echo "=== Last 20 log lines ==="
          tail -20 data/logs/ci-test-job/run.log

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug-${{ github.run_id }}
          path: |
            data/logs/
            data/outputs/
          retention-days: 3
