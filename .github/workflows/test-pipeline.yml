name: Test pipeline end-to-end

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kestra/flows/**"
      - ".github/workflows/test-pipeline.yml"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create test input file
        run: |
          mkdir -p data/inputs/ci-test-job/
          # Use a real domain so external API calls have meaningful data
          echo '{"unique_id":"ci-001","business_name":"ViableView","domain":"viableview.us","email":"contact@viableview.us"}' \
            > data/inputs/ci-test-job/input.jsonl

      - name: Run pipeline container
        # Allow the pipeline to exit non-zero — external API results vary.
        # What we're verifying is that the container ran and produced output.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/data:/data" \
            -e JOB_ID=ci-test-job \
            -e INPUT_FILE_KEY=inputs/ci-test-job/input.jsonl \
            -e CONFIG='{"enable_proxy":false,"skip_duplicates":true}' \
            -e DATA_DIR=/data \
            -e SERPER_API_KEY=${{ secrets.SERPER_API_KEY }} \
            -e ZUHAL_API_KEY=${{ secrets.ZUHAL_API_KEY }} \
            -e BBOPS_BASE_URL=https://email-verifier.bbops.io \
            ghcr.io/${{ env.OWNER }}/us-z-3:latest || EXIT_CODE=$?

          echo "Container exit code: ${EXIT_CODE:-0}"
        timeout-minutes: 15

      - name: Verify pipeline wrote output
        run: |
          echo "=== Data directory tree ==="
          find data/ -type f | sort

          echo ""
          echo "=== Log file (last 30 lines) ==="
          LOG="data/logs/ci-test-job/run.log"
          if [ -f "$LOG" ]; then
            tail -30 "$LOG"
          else
            echo "No log file found — checking job data directory"
            find data/ -name "*.log" | head -5
          fi

          echo ""
          echo "=== Output file ==="
          OUTPUT="data/outputs/ci-test-job/result.csv"
          if [ -f "$OUTPUT" ]; then
            echo "Output exists: $(wc -l < "$OUTPUT") lines"
            head -5 "$OUTPUT"
          else
            echo "No output file yet — pipeline may have partially completed"
          fi

          # Pass as long as the log file exists — proves the container ran through entrypoint.py
          test -f "$LOG" || (echo "FAIL: no log file written — entrypoint.py did not run" && exit 1)

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_id }}
          path: |
            data/logs/
            data/outputs/
          retention-days: 7
