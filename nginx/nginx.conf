events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Increase body size limit for file uploads (1 GB)
    client_max_body_size 1024m;

    # Upstream services
    upstream backend {
        server backend:8000;
    }

    upstream dashboard {
        server dashboard:3000;
    }

    # HTTP server — redirects to HTTPS in production
    # For local dev, comment out the redirect block and serve on port 80 directly.
    server {
        listen 80;
        server_name _;

        # Uncomment to redirect HTTP → HTTPS in production:
        # return 301 https://$host$request_uri;

        # API routes → FastAPI backend
        location /api/ {
            proxy_pass         http://backend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Everything else → React dashboard
        location / {
            proxy_pass         http://dashboard;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server — uncomment and populate certs in nginx/certs/ for production
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     client_max_body_size 1024m;
    #
    #     location /api/ {
    #         proxy_pass         http://backend/;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 300s;
    #     }
    #
    #     location / {
    #         proxy_pass         http://dashboard;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #     }
    # }
