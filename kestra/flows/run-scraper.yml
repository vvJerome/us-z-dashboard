id: run-scraper
namespace: prod
description: "Runs the us-z-3 email discovery pipeline as an isolated Docker container."

inputs:
  - id: job_id
    type: STRING
    description: "UUID assigned by FastAPI when the job was created"
  - id: input_file_key
    type: STRING
    description: "Relative path within /data to the uploaded input file (e.g. inputs/abc123/input.jsonl)"
  - id: config
    type: STRING
    description: 'JSON config toggles: {"enable_proxy": false, "skip_duplicates": true}'
    defaults: '{"enable_proxy": false, "skip_duplicates": true}'

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: scrape
    type: io.kestra.plugin.docker.Run
    containerImage: "ghcr.io/vvjerome/us-z-3:latest"
    pullPolicy: ALWAYS
    timeout: PT72H
    volumes:
      - "data_volume:/data"
      - "/root/.ssh/racknerd_egress:/root/.ssh/racknerd_egress:ro"
    env:
      JOB_ID: "{{ inputs.job_id }}"
      INPUT_FILE_KEY: "{{ inputs.input_file_key }}"
      CONFIG: "{{ inputs.config }}"
      DATA_DIR: "/data"
      SERPER_API_KEY: "{{ envs.SERPER_API_KEY }}"
      ZUHAL_API_KEY: "{{ envs.ZUHAL_API_KEY }}"
      RACKNERD_HOST: "{{ envs.RACKNERD_HOST }}"
      RACKNERD_SSH_USER: "{{ envs.RACKNERD_SSH_USER }}"
      RACKNERD_SSH_PORT: "{{ envs.RACKNERD_SSH_PORT }}"
      RACKNERD_SOCKS_PORT: "{{ envs.RACKNERD_SOCKS_PORT }}"
      BBOPS_BASE_URL: "{{ envs.BBOPS_BASE_URL }}"

errors:
  - id: mark-failed
    type: io.kestra.plugin.core.flow.Sequential
    tasks:
      - id: log-failure
        type: io.kestra.plugin.core.log.Log
        message: "Job {{ inputs.job_id }} failed — FastAPI will sync via Kestra execution API poll."
        level: ERROR

triggers:
  - id: api
    type: io.kestra.plugin.core.trigger.Webhook
    key: "23d86356dae3338d4bdda22c489a1ec1fa42508b"
